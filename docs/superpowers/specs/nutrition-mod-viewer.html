<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>营养仿真 MOD · 逻辑可视化同步查看器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
/* ============ SURVIVAL TECHNICAL MANUAL 主题 ============ */
:root{
  --bg:#15110d;
  --bg-2:#1f1812;
  --bg-3:#2a211a;
  --panel:#221a13;
  --panel-2:#2c231b;
  --line:#3d3126;
  --line-2:#5a4736;
  --text:#d8c9b4;
  --text-dim:#9a8a72;
  --text-faint:#6b5d4a;
  --amber:#d4a24c;
  --amber-2:#f0c060;
  --green:#7fa85b;
  --green-2:#a0c970;
  --red:#c25b4a;
  --red-2:#e0735f;
  --blue:#6a90b8;
  --paper:#c9b896;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Serif SC',serif;
  font-size:14px;
  line-height:1.7;
  display:flex;
  flex-direction:column;
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(212,162,76,.04), transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(127,168,91,.03), transparent 50%),
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.03) 3px);
}
/* grain overlay */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ============ HEADER ============ */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--bg-2),var(--bg));
  flex-shrink:0;
}
header .brand{display:flex;align-items:center;gap:14px}
header .logo{
  width:34px;height:34px;border:2px solid var(--amber);border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Special Elite',monospace;font-size:18px;color:var(--amber-2);
  background:rgba(212,162,76,.08);
  box-shadow:0 0 12px rgba(212,162,76,.15) inset;
}
header h1{
  font-family:'Special Elite',monospace;font-size:16px;letter-spacing:1.5px;
  color:var(--amber-2);text-transform:uppercase;
}
header .sub{font-size:11px;color:var(--text-faint);letter-spacing:1px;font-family:'JetBrains Mono',monospace}
header .meta{display:flex;gap:18px;align-items:center}
header .stat{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim)}
header .stat b{color:var(--green-2);font-weight:700}

/* ============ MAIN SPLIT ============ */
main{flex:1;display:flex;overflow:hidden}

/* ---- LEFT: DOC PANE ---- */
.doc-pane{
  width:42%;min-width:360px;max-width:560px;
  display:flex;flex-direction:column;
  border-right:1px solid var(--line);
  background:var(--bg-2);
}
.doc-tabs{
  display:flex;border-bottom:1px solid var(--line);flex-shrink:0;
  background:var(--bg-3);
}
.doc-tab{
  padding:9px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--text-dim);cursor:pointer;letter-spacing:1px;
  border-right:1px solid var(--line);
  transition:all .2s;
}
.doc-tab.active{color:var(--amber-2);background:var(--bg-2);border-bottom:2px solid var(--amber)}
.doc-tab:hover{color:var(--text)}
.doc-body{flex:1;overflow-y:auto;padding:20px 24px}
.doc-body::-webkit-scrollbar{width:8px}
.doc-body::-webkit-scrollbar-track{background:var(--bg)}
.doc-body::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:0}

/* doc outline nav */
.outline{margin-bottom:24px;padding:14px 16px;background:var(--panel);border:1px solid var(--line)}
.outline h3{font-family:'Special Elite',monospace;font-size:11px;color:var(--amber);letter-spacing:2px;margin-bottom:10px;text-transform:uppercase}
.outline ol{list-style:none;counter-reset:sec}
.outline li{counter-increment:sec;padding:4px 0 4px 24px;position:relative;cursor:pointer;color:var(--text-dim);font-size:13px;transition:all .15s}
.outline li::before{content:counter(sec)".";position:absolute;left:0;font-family:'JetBrains Mono',monospace;color:var(--text-faint);font-size:11px}
.outline li:hover{color:var(--text);background:rgba(212,162,76,.05)}
.outline li.active{color:var(--amber-2)}
.outline li.active::before{color:var(--amber)}

/* doc sections */
.doc-section{margin-bottom:36px;scroll-margin-top:16px}
.doc-section .sec-num{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--amber);
  letter-spacing:2px;margin-bottom:4px;
}
.doc-section h2{
  font-family:'Noto Serif SC',serif;font-weight:900;font-size:20px;
  color:var(--paper);margin-bottom:14px;padding-bottom:8px;
  border-bottom:1px solid var(--line);
}
.doc-section h3{font-size:15px;color:var(--amber-2);margin:18px 0 8px;font-weight:600}
.doc-section h4{font-size:13px;color:var(--green-2);margin:14px 0 6px;font-weight:600}
.doc-section p{margin:8px 0;color:var(--text)}
.doc-section ul,.doc-section ol{margin:8px 0 8px 22px}
.doc-section li{margin:3px 0;color:var(--text-dim)}
.doc-section table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
.doc-section th,.doc-section td{border:1px solid var(--line);padding:5px 9px;text-align:left}
.doc-section th{background:var(--bg-3);color:var(--amber);font-weight:600}
.doc-section td{color:var(--text-dim)}
.doc-section code{
  font-family:'JetBrains Mono',monospace;font-size:11px;
  background:var(--bg);padding:1px 5px;color:var(--green-2);border:1px solid var(--line);
}
.doc-section pre{
  background:var(--bg);border:1px solid var(--line);padding:12px;
  margin:10px 0;overflow-x:auto;font-size:11px;
}
.doc-section pre code{background:none;border:none;padding:0;color:var(--text)}
.doc-section blockquote{
  border-left:2px solid var(--amber);background:rgba(212,162,76,.04);
  padding:8px 14px;margin:10px 0;color:var(--text-dim);font-style:italic;
}

/* highlight active section */
.doc-section.flash{animation:flash .8s ease}
@keyframes flash{0%{background:rgba(212,162,76,.15)}100%{background:transparent}}

/* ---- RIGHT: VIZ PANE ---- */
.viz-pane{flex:1;display:flex;flex-direction:column;background:var(--bg)}
.viz-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;border-bottom:1px solid var(--line);
  background:var(--bg-2);flex-shrink:0;
}
.viz-tabs{display:flex}
.viz-tab{
  padding:11px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--text-faint);cursor:pointer;letter-spacing:1px;
  border-bottom:2px solid transparent;transition:all .2s;
}
.viz-tab.active{color:var(--amber-2);border-bottom-color:var(--amber)}
.viz-tab:hover{color:var(--text)}
.viz-tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--text-faint);margin-right:6px;vertical-align:middle}
.viz-tab.active .dot{background:var(--green);box-shadow:0 0 6px var(--green)}
.viz-legend{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);display:flex;gap:14px}
.viz-legend span{display:flex;align-items:center;gap:5px}
.viz-legend i{width:10px;height:10px;display:inline-block;border:1px solid var(--line)}

.viz-canvas{flex:1;overflow:auto;padding:24px;position:relative}
.viz-canvas::-webkit-scrollbar{width:10px;height:10px}
.viz-canvas::-webkit-scrollbar-track{background:var(--bg)}
.viz-canvas::-webkit-scrollbar-thumb{background:var(--line-2)}

/* diagram title bar */
.diagram-title{
  display:flex;align-items:baseline;gap:12px;margin-bottom:20px;
}
.diagram-title .tag{
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--bg);
  background:var(--amber);padding:2px 8px;letter-spacing:1px;
}
.diagram-title h2{font-family:'Noto Serif SC',serif;font-size:18px;color:var(--paper);font-weight:900}
.diagram-title .desc{font-size:12px;color:var(--text-faint);margin-left:auto}

/* ============ DIAGRAM: MODULE ARCHITECTURE ============ */
.arch-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
}
.arch-group{
  background:var(--panel);border:1px solid var(--line);
  padding:14px;position:relative;
}
.arch-group .group-label{
  position:absolute;top:-9px;left:12px;background:var(--bg-2);
  padding:0 8px;font-family:'JetBrains Mono',monospace;font-size:10px;
  color:var(--amber);letter-spacing:1px;
}
.arch-module{
  background:var(--bg-3);border:1px solid var(--line-2);
  padding:10px 12px;margin-bottom:8px;cursor:pointer;
  transition:all .2s;position:relative;
}
.arch-module:last-child{margin-bottom:0}
.arch-module:hover{border-color:var(--amber);transform:translateX(2px)}
.arch-module.active{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.arch-module .m-name{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);font-weight:700}
.arch-module .m-desc{font-size:11px;color:var(--text-faint);margin-top:3px;line-height:1.4}
.arch-module .m-layer{
  font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--green-2);
  margin-top:4px;letter-spacing:1px;
}

/* dependency arrows */
.arch-deps{margin-top:20px;display:flex;flex-direction:column;gap:6px}
.dep-row{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim)}
.dep-row .from{color:var(--blue)}
.dep-row .arrow{color:var(--text-faint)}
.dep-row .to{color:var(--green-2)}

/* ============ DIAGRAM: DATA FLOW ============ */
.flow-wrap{display:flex;flex-direction:column;gap:18px}
.flow-row{display:flex;align-items:stretch;gap:0}
.flow-node{
  flex:1;background:var(--panel);border:1px solid var(--line-2);
  padding:14px;text-align:center;cursor:pointer;transition:all .2s;position:relative;
}
.flow-node:hover{border-color:var(--amber)}
.flow-node.active{border-color:var(--amber);box-shadow:0 0 12px rgba(212,162,76,.2)}
.flow-node .fn-title{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--amber-2);font-weight:700;margin-bottom:4px}
.flow-node .fn-sub{font-size:11px;color:var(--text-dim)}
.flow-node .fn-src{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-faint);margin-top:6px}
.flow-arrow{
  width:40px;display:flex;align-items:center;justify-content:center;
  color:var(--text-faint);font-size:18px;flex-shrink:0;
}
.flow-arrow.down{width:auto;height:28px;flex-direction:column;font-size:12px}

/* ============ DIAGRAM: EVENT TIMELINE ============ */
.timeline{position:relative;padding-left:30px}
.timeline::before{
  content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,var(--amber),var(--line-2),var(--green));
}
.ev-item{position:relative;padding:0 0 22px 0}
.ev-item::before{
  content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;
  border:2px solid var(--bg);background:var(--amber);border-radius:50%;
}
.ev-item.trigger::before{background:var(--red)}
.ev-item.daily::before{background:var(--blue)}
.ev-item.client::before{background:var(--green)}
.ev-card{
  background:var(--panel);border:1px solid var(--line);padding:12px 16px;
  cursor:pointer;transition:all .2s;
}
.ev-card:hover{border-color:var(--amber);transform:translateX(3px)}
.ev-card.active{border-color:var(--amber)}
.ev-card .ev-event{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--amber-2);font-weight:700}
.ev-card .ev-type{
  font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--bg);
  padding:1px 6px;margin-left:8px;letter-spacing:1px;
}
.ev-card .ev-type.trigger{background:var(--red)}
.ev-card .ev-type.daily{background:var(--blue)}
.ev-card .ev-type.client{background:var(--green)}
.ev-card .ev-desc{font-size:12px;color:var(--text-dim);margin-top:4px}
.ev-card .ev-mod{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--green-2);margin-top:6px}

/* ============ DIAGRAM: DISEASE SYSTEM ============ */
.disease-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.disease-card{
  background:var(--panel);border:1px solid var(--line);padding:14px;
  cursor:pointer;transition:all .2s;border-left:3px solid var(--red);
}
.disease-card:hover{border-color:var(--amber);transform:translateY(-2px)}
.disease-card.active{border-color:var(--amber);box-shadow:0 0 12px rgba(212,162,76,.2)}
.disease-card .d-name{font-size:14px;font-weight:700;color:var(--paper);margin-bottom:4px}
.disease-card .d-nutri{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--red-2);margin-bottom:8px}
.disease-card .d-stage{display:flex;gap:4px;margin-bottom:8px}
.disease-card .stage-dot{flex:1;height:6px;background:var(--bg-3);border:1px solid var(--line);text-align:center;font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--text-faint);line-height:6px}
.disease-card .d-symptom{font-size:11px;color:var(--text-dim);line-height:1.5}

.disease-flow{
  margin-top:20px;padding:16px;background:var(--panel);border:1px solid var(--line);
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);line-height:2;
}
.disease-flow b{color:var(--amber-2)}
.disease-flow .good{color:var(--green-2)}
.disease-flow .bad{color:var(--red-2)}

/* ============ DIAGRAM: EXERCISE & GROWTH ============ */
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ex-block{background:var(--panel);border:1px solid var(--line);padding:16px}
.ex-block h3{font-size:13px;color:var(--amber-2);margin-bottom:10px;font-weight:600}
.ex-table{width:100%;border-collapse:collapse;font-size:11px}
.ex-table th,.ex-table td{border:1px solid var(--line);padding:5px 8px;text-align:left}
.ex-table th{background:var(--bg-3);color:var(--amber);font-weight:600;font-size:10px}
.ex-table td{color:var(--text-dim)}
.bar{height:6px;background:var(--bg-3);position:relative;margin-top:3px}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--amber))}

.growth-matrix{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.gm-cell{
  background:var(--bg-3);border:1px solid var(--line);padding:10px;
  font-size:11px;position:relative;
}
.gm-cell .gm-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-faint);letter-spacing:1px;margin-bottom:4px}
.gm-cell .gm-val{font-weight:700;font-size:12px}
.gm-cell.pos .gm-val{color:var(--green-2)}
.gm-cell.neg .gm-val{color:var(--red-2)}
.gm-cell .gm-arrow{font-size:14px;margin-right:4px}

/* ============ DIAGRAM: SCORE FORMULA ============ */
.score-steps{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.score-step{display:flex;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:all .2s}
.score-step:hover{border-color:var(--amber)}
.score-step.active{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.score-step .ss-num{width:58px;background:var(--bg-3);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.score-step .ss-num .n{font-family:'JetBrains Mono',monospace;font-size:22px;color:var(--amber-2);font-weight:700;line-height:1}
.score-step .ss-num .t{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--text-faint);letter-spacing:2px;margin-top:3px}
.score-step .ss-body{padding:12px 16px}
.score-step .ss-title{font-size:14px;color:var(--paper);font-weight:700}
.score-step .ss-formula{
  display:block;font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--amber-2);
  background:var(--bg);border:1px solid var(--line-2);border-left:3px solid var(--amber);
  padding:8px 16px;margin:8px 0;letter-spacing:.5px;
}
.score-step .ss-desc{font-size:11px;color:var(--text-dim);line-height:1.7}

.score-lab-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.score-lab,.score-curve{background:var(--panel);border:1px solid var(--line);padding:16px}
.score-lab h3,.score-curve h3,.score-branch h3,.score-clamps h3{font-size:13px;color:var(--amber-2);margin-bottom:12px;font-weight:600}
.lab-slider{margin-bottom:12px}
.lab-slider label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-bottom:5px;font-family:'JetBrains Mono',monospace}
.lab-slider label b{color:var(--amber-2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:var(--line-2);outline:none;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;background:var(--amber);border:3px solid var(--bg-2);border-radius:50%;cursor:pointer;box-shadow:0 0 0 1px var(--amber)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--amber);border:2px solid var(--bg-2);border-radius:50%;cursor:pointer}
.lab-results{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.lr{background:var(--bg-3);border:1px solid var(--line);padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.lr span{font-size:10px;color:var(--text-faint);font-family:'JetBrains Mono',monospace}
.lr b{font-family:'JetBrains Mono',monospace;font-size:15px}
.lr b.pos{color:var(--green-2)}
.lr b.neg{color:var(--red-2)}
.lr b.zero{color:var(--text-dim)}

.curve-legend{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-faint);margin-top:8px;padding:0 8px}

.score-branch{background:var(--panel);border:1px solid var(--line);padding:16px;margin-bottom:16px}
.branch-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.branch-card{background:var(--bg-3);border:1px solid var(--line);padding:12px;text-align:center;opacity:.4;transition:all .25s}
.branch-card.on{opacity:1;border-color:var(--amber);box-shadow:0 0 10px rgba(212,162,76,.15)}
.branch-card .bc-cond{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--paper);font-weight:700;margin-bottom:4px}
.branch-card .bc-eff{font-size:11px;color:var(--text-dim)}

.score-clamps{background:var(--panel);border:1px solid var(--line);padding:16px}
.clamp-row{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px dashed var(--line)}
.clamp-row:last-child{border-bottom:none}
.clamp-row code{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--green-2);background:var(--bg);padding:3px 10px;border:1px solid var(--line);min-width:230px;text-align:center}
.clamp-row span{font-size:11px;color:var(--text-dim)}

/* ============ SVG sparkline for trend ============ */
.spark-wrap{margin-top:8px}
.spark-wrap svg{width:100%;height:30px}

/* ============ UTIL ============ */
.hidden{display:none!important}
.divider{height:1px;background:var(--line);margin:16px 0}
.note{
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);
  padding:8px 12px;background:var(--bg);border-left:2px solid var(--blue);margin-top:12px;
}

/* responsive */
@media(max-width:1100px){
  .doc-pane{width:45%}
  .disease-grid,.ex-grid,.score-lab-wrap,.branch-cards{grid-template-columns:1fr}
  .arch-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">N</div>
    <div>
      <h1>营养仿真 MOD · 逻辑同步查看器</h1>
      <div class="sub">PROJECT ZOMBOID BUILD 42 &nbsp;//&nbsp; NUTRITION SIMULATION MOD</div>
    </div>
  </div>
  <div class="meta">
    <div class="stat">模块 <b>8</b></div>
    <div class="stat">事件 <b>7</b></div>
    <div class="stat">疾病 <b>7</b></div>
    <div class="stat">营养素 <b>8</b></div>
  </div>
</header>

<main>
  <!-- ============ LEFT: DOCUMENT ============ -->
  <div class="doc-pane">
    <div class="doc-tabs">
      <div class="doc-tab active" data-view="outline">目录</div>

const docContent = document.getElementById('docContent');
const outlineList = document.getElementById('outlineList');
const vizCanvas = document.getElementById('vizCanvas');

// 渲染文档
function renderDoc(){
  SECTIONS.forEach(s=>{
    outlineList.insertAdjacentHTML('beforeend',
      `<li data-sec="${s.id}">${s.title}</li>`);
    docContent.insertAdjacentHTML('beforeend',
      `<section class="doc-section" id="sec-${s.id}" data-sec="${s.id}">
        <div class="sec-num">§ ${s.num}</div>
        <h2>${s.title}</h2>
        ${s.content}
      </section>`);
  });
  outlineList.querySelectorAll('li').forEach(li=>{
    li.addEventListener('click',()=>scrollToSec(li.dataset.sec));
  });
}

function scrollToSec(id){
  const el = document.getElementById('sec-'+id);
  if(el){
    el.scrollIntoView({behavior:'smooth',block:'start'});
    el.classList.add('flash');
    setTimeout(()=>el.classList.remove('flash'),800);
    setActiveOutline(id);
    // 同步切换到相关可视化
    syncVizFromSec(id);
  }
}

function setActiveOutline(id){
  outlineList.querySelectorAll('li').forEach(li=>{
    li.classList.toggle('active', li.dataset.sec===id);
  });
}

// 根据章节自动切换可视化 tab
function syncVizFromSec(id){
  const map = {
    overview:'arch', nutrition:'arch', food:'arch', intake:'flow',
    exercise:'exercise', growth:'score', weight:'exercise',
    disease:'disease', ui:'arch', arch:'arch'
  };
  const target = map[id] || 'arch';
  switchViz(target, id);
}

/* ---- 可视化渲染 ---- */
let currentViz = 'arch';
let currentSec = null;

function switchViz(vizId, secId){
  currentViz = vizId;
  currentSec = secId;
  document.querySelectorAll('.viz-tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.viz===vizId);
  });
  renderViz(vizId, secId);
}

function renderViz(id, secId){
  switch(id){
    case 'arch': renderArch(secId); break;
    case 'flow': renderFlow(secId); break;
    case 'score': renderScore(secId); break;
    case 'events': renderEvents(secId); break;
    case 'disease': renderDisease(secId); break;
    case 'exercise': renderExercise(secId); break;
  }
}

      html += `<div class="arch-module${active?' active':''}" data-mod="${m.name}" data-sec="${moduleToSec(m.name)}">

function isModuleRelated(modName, secId){
  const map = {
    'Nutri_DataLayer.lua':['food'],
    'Nutri_Core.lua':['food','intake'],
    'Nutri_History.lua':['growth'],
    'Nutri_Exercise.lua':['exercise'],
    'Nutri_Growth.lua':['growth','weight'],
    'Nutri_Diseases.lua':['disease'],
    'Nutri_UI.lua':['ui'],
  };
  return (map[modName]||[]).includes(secId);
}
function moduleToSec(modName){
  const map = {
    'Nutri_Config.lua':'arch','Nutri_DataLayer.lua':'food','Nutri_History.lua':'growth',
    'Nutri_Core.lua':'intake','Nutri_UI.lua':'ui','Nutri_UITheme.lua':'ui',
    'Nutri_Diseases.lua':'disease','Nutri_Exercise.lua':'exercise','Nutri_Growth.lua':'growth',
  };
  return map[modName] || 'arch';
}
function bindModuleClicks(){
  vizCanvas.querySelectorAll('.arch-module').forEach(el=>{

function flowToSec(title){
  if(title.includes('摄入')) return 'intake';

  if(title.includes('净额')||title.includes('历史')||title.includes('评分')) return 'growth';
  if(title.includes('耐力')||title.includes('成长')||title.includes('体重')) return 'growth';

  return '#';
}

/* clamp 曲线 SVG 绘制 */
function curveX(v){ const pad=42,W=440; return pad+(v+2)/4*(W-pad*2); }
function curveY(v){ const H=230; return H/2 - v/1.35*(H/2-16); }
function renderClampCurve(){
  const box=document.getElementById('curveBox');
  if(!box) return;
  const W=440,H=230;
  let g='';
  // 竖向网格（每 0.5）
  for(let x=-2;x<=2.01;x+=0.5){
    g+=`<line x1="${curveX(x)}" y1="${curveY(1.3)}" x2="${curveX(x)}" y2="${curveY(-1.3)}" stroke="#3d3126" stroke-width="1"/>`;
  }
  // 横向参考线：−1 / 0 / +1
  [-1,0,1].forEach(y=>{
    g+=`<line x1="${curveX(-2)}" y1="${curveY(y)}" x2="${curveX(2)}" y2="${curveY(y)}"
      stroke="${y===0?'#5a4736':'#5a3a30'}" stroke-width="1" ${y!==0?'stroke-dasharray="4,3"':''}/>`;
  });
  // clamp 曲线主体
  const path=`M ${curveX(-2)} ${curveY(-1)} L ${curveX(-1)} ${curveY(-1)} L ${curveX(1)} ${curveY(1)} L ${curveX(2)} ${curveY(1)}`;
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${g}
    <path d="${path}" fill="none" stroke="#d4a24c" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="${curveX(-1)}" y="${curveY(-1)+16}" fill="#e0735f" font-size="10" font-family="JetBrains Mono" text-anchor="middle">−1</text>
    <text x="${curveX(1)}" y="${curveY(1)-8}" fill="#e0735f" font-size="10" font-family="JetBrains Mono" text-anchor="middle">+1</text>
    <text x="${curveX(0)}" y="${curveY(0)-6}" fill="#9a8a72" font-size="10" font-family="JetBrains Mono" text-anchor="middle">0</text>
    <line id="markV" x1="${curveX(0)}" y1="${curveY(1.3)}" x2="${curveX(0)}" y2="${curveY(-1.3)}" stroke="#7fa85b" stroke-width="1" stroke-dasharray="3,3"/>
    <line id="markH" x1="${curveX(-2)}" y1="${curveY(0)}" x2="${curveX(2)}" y2="${curveY(0)}" stroke="#7fa85b" stroke-width="1" stroke-dasharray="3,3"/>
    <circle id="curveMark" cx="${curveX(0)}" cy="${curveY(0)}" r="6" fill="#a0c970" stroke="#15110d" stroke-width="2"/>
    <text id="markLabel" x="${curveX(0)}" y="${curveY(0)-12}" fill="#a0c970" font-size="11" font-family="JetBrains Mono" text-anchor="middle">d=0.00</text>
    <text x="${curveX(2)}" y="${curveY(-1.3)+18}" fill="#6b5d4a" font-size="10" font-family="JetBrains Mono" text-anchor="end">Net/DRI →</text>
    <text x="${curveX(-2)}" y="${curveY(1.3)-6}" fill="#6b5d4a" font-size="10" font-family="JetBrains Mono">d ↑</text>
  </svg>`;
}

function updateCurveMark(x){
  const mark=document.getElementById('curveMark');
  if(!mark) return;
  const cx=curveX(Math.max(-2,Math.min(2,x)));
  const cy=curveY(Math.max(-1,Math.min(1,x)));
  mark.setAttribute('cx',cx); mark.setAttribute('cy',cy);
  const mv=document.getElementById('markV'), mh=document.getElementById('markH');
  mv.setAttribute('x1',cx); mv.setAttribute('x2',cx);
  mh.setAttribute('y1',cy); mh.setAttribute('y2',cy);
  const lb=document.getElementById('markLabel');
  const d=Math.max(-1,Math.min(1,x));
  lb.textContent='d='+(d>0?'+':'')+d.toFixed(2);
  lb.setAttribute('x',Math.max(curveX(-1.6),Math.min(curveX(1.6),cx)));
  lb.setAttribute('y',d>=0?cy-12:cy+20);
}

/* 交互演算绑定 */
function bindScoreLab(){
  const el=id=>document.getElementById(id);
  const fmt=(v,unit)=>{ const s=v>0?'+':''; return s+v.toFixed(2)+unit; };
  const setRes=(id,v,unit)=>{
    const b=el(id).querySelector('b');
    b.textContent=fmt(v,unit);
    b.className=v>0.005?'pos':(v<-0.005?'neg':'zero');
  };
  const update=()=>{
    const intake=+el('labIn').value, out=+el('labOut').value;
    const hist=+el('labHist').value/100, stim=+el('labStim').value/100;
    el('labInVal').textContent=intake+'%';
    el('labOutVal').textContent=out+'%';
    el('labHistVal').textContent=(hist>0?'+':'')+hist.toFixed(2);
    el('labStimVal').textContent=Math.round(stim*100)+'%';
    // STEP1 净额（以 DRI 百分比表示）
    const net=intake-out;
    // STEP2 归一化
    const d=Math.max(-1,Math.min(1,net/100));
    // STEP3 7天均值（今日 + 近6天惯性）
    const s=(d+6*hist)/7;
    // STEP5 经验流
    const xp=stim*s;
    setRes('lrNet',net,'%');
    setRes('lrD',d,'');
    setRes('lrS',s,'');
    setRes('lrXP',xp,'');
    // 曲线标记（x 轴 = Net/DRI）
    updateCurveMark(net/100);
    // 短期耐力分支点亮
    const s2=(d+hist)/2;
    el('brPos').classList.toggle('on',s2>0.05);
    el('brZero').classList.toggle('on',s2>=-0.05&&s2<=0.05);
    el('brNeg').classList.toggle('on',s2<-0.05);
  };
  ['labIn','labOut','labHist','labStim'].forEach(id=>{
    el(id).addEventListener('input',update);
  });
  update();
}

document.querySelectorAll('.doc-tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.doc-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('outlineBox').style.display = tab.dataset.view==='outline' ? 'block' : 'none';
  });
});

// scroll spy: highlight outline based on visible section
const docBody = document.getElementById('docBody');
docBody.addEventListener('scroll',()=>{
  const sections = docContent.querySelectorAll('.doc-section');
  let current = null;
  const scrollTop = docBody.scrollTop;
  sections.forEach(s=>{
    if(s.offsetTop - docBody.offsetTop - 60 <= scrollTop) current = s.dataset.sec;
  });
  if(current) setActiveOutline(current);
});
